name: Pipeline groundskeeper

# Deterministic, no-LLM, no-Max-pool reconciliation sweep for pipeline label
# state, in the same trust class as the auto-merge loop: plain shell + gh +
# jq, reading issue/PR fields only as data (never as instructions), running
# no PR-controlled code.
#
# Why it exists (2026-07-20 incident): a `status:building` issue whose build
# dies WITHOUT reaching the build workflow's own verify/escalate step zombies
# forever. The two ways that happens:
#   - the build job hits `timeout-minutes` — GitHub reports the run as
#     `cancelled`, which the failure-keyed retry loop
#     (pipeline-build-retry.yml, `conclusion == 'failure'`) never re-runs and
#     the final-attempt escalation never sees;
#   - a fallback-Routine claim (docs/PIPELINE.md §4) whose session dies leaves
#     no workflow run at all.
# Four issues sat `status:building` with zero open PRs; the fallback lane
# "continued" them forever and the `status:approved` queue starved behind
# them. This sweep enforces the invariant the state machine promises: an
# issue is `status:building` ONLY while a build is genuinely in flight.
#
# Rule: any open `status:building` issue with NO open same-repo PR closing it
# and NO activity for STALE_HOURS is moved to the `needs-human` lane, with
# BOTH `status:building` and `status:approved` removed — so neither the
# label-triggered build worker nor the hourly fallback can silently re-claim
# it. A human re-queues by removing `needs-human` and re-adding
# `status:approved`.
#
# STALE_HOURS (4) deliberately exceeds the build job's 180-min
# `timeout-minutes` (keep them in sync when changing either) plus
# claim-comment lag: each build attempt re-claims with a fresh comment
# (bumping the issue's updatedAt), so an issue quiet for 4h cannot have a
# live build attempt behind it.

on:
  schedule:
    - cron: '17 * * * *' # hourly; minute offset avoids the top-of-hour Actions rush
  workflow_dispatch:

permissions:
  issues: write
  # `write` (was `read`) so the CI-never-executed sweep below can label and
  # comment on the PR it finds; `actions: read` so it can see run state at all.
  # Same trust class as before: deterministic shell reading API fields as jq
  # data, running no PR-controlled code.
  pull-requests: write
  actions: read

concurrency:
  group: pipeline-groundskeeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      STALE_HOURS: 4
      # A CI run normally starts within seconds and finishes in ~10-13 min. A
      # head commit this old with nothing even STARTED is not slow, it is
      # wedged. Generous on purpose: this sweep only ever escalates to a human,
      # so a late escalation costs nothing while a premature one is noise.
      CI_STUCK_MINUTES: 45
      CI_STUCK_MARKER: '<!-- groundskeeper-ci-never-ran -->'
    steps:
      - name: Escalate zombie status:building issues
        run: |
          set -euo pipefail
          now="$(date +%s)"
          stale_secs="$(( STALE_HOURS * 3600 ))"

          # Open same-repo PR bodies, fetched once, held strictly as jq data.
          pr_bodies="$(gh pr list -R "${REPO}" --state open --limit 100 \
            --json body,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not) | .body // ""]')"

          issues="$(gh issue list -R "${REPO}" --state open \
            --label status:building --limit 20 --json number,updatedAt \
            --jq '.[] | "\(.number) \(.updatedAt)"')"

          if [ -z "${issues}" ]; then
            echo "No status:building issues — nothing to reconcile."
            exit 0
          fi

          while read -r num updated; do
            [ -z "${num}" ] && continue
            updated_epoch="$(date -d "${updated}" +%s)"
            age=$(( now - updated_epoch ))

            # An open same-repo PR closing this issue means the build lane is
            # legitimately in flight (review/revise/autofix own it now) — skip.
            # Deliberately no PR-author check (unlike autofix/auto-merge, which
            # gate on the build worker's bot identity): isCrossRepository
            # already excludes forks, so a matching PR requires push access to
            # THIS repo, and the worst a crafted "Closes #N" PR achieves here
            # is delaying an escalation. Revisit if push access ever broadens.
            has_pr="$(jq --arg n "${num}" \
              '[.[] | select(test("[Cc]loses #" + $n + "\\b"))] | length' <<<"${pr_bodies}")"
            if [ "${has_pr}" -gt 0 ]; then
              echo "#${num}: open PR closes it — healthy, skipping."
              continue
            fi

            if [ "${age}" -lt "${stale_secs}" ]; then
              echo "#${num}: no PR yet but last activity only $(( age / 60 ))m ago — a build may still be running, skipping."
              continue
            fi

            echo "#${num}: status:building for $(( age / 3600 ))h with no open PR — escalating to needs-human."
            gh issue edit "${num}" -R "${REPO}" \
              --add-label needs-human \
              --remove-label status:building \
              --remove-label status:approved || true
            gh issue comment "${num}" -R "${REPO}" --body \
              "🧹 Groundskeeper: \`status:building\` for over ${STALE_HOURS}h with no open PR closing this issue — the build died without reaching its own escalation step (a timed-out job reports \`cancelled\`, which the failure-keyed retry loop never re-runs). Moved to \`needs-human\`; re-queue by removing \`needs-human\` and re-adding \`status:approved\`." || true
          done <<< "${issues}"

      # Second sweep (issue #1348): an open PR whose head commit has NO
      # executed CI run — the wedge that cost #1248 and #1288 several days
      # each, with no loop noticing.
      #
      # How it happens: a push authored by the job's own GITHUB_TOKEN (the
      # conflict-resolver's checkpoint step, or a merge commit landing on a PR
      # branch) cannot trigger workflows. GitHub does not simply skip the run —
      # it records one that is `completed` with `conclusion: action_required`
      # and ZERO jobs. That state matches nothing:
      #   - ci-retry.yml and pipeline-pr-autofix.yml key on `failure`;
      #   - the first sweep above keys on `status:building` ISSUES, and these
      #     PRs are open and legitimately closing their issue;
      #   - auto-merge requires all checks green, so it declines — silently,
      #     because an unvetted PR earns no `human-merge-ready` escalation.
      # The PR is neither green nor red nor escalated: it is invisible, and
      # stays that way indefinitely.
      #
      # This does NOT try to auto-recover. The run is terminal (`completed`),
      # so GitHub's approve endpoint does not apply; re-running a zero-job run
      # produces another zero-job run; and any push this job could make would
      # be GITHUB_TOKEN-authored — the same trap that caused it. Pushing an
      # empty commit or reopening the PR to kick CI is forbidden by CLAUDE.md.
      # So the deliverable is visibility: label `needs-human` and say exactly
      # what is wrong and what clears it. That is the whole fix — the failure
      # here was never that it was unrecoverable, only that it was silent.
      - name: Escalate PRs whose CI never executed
        run: |
          set -euo pipefail
          now="$(date +%s)"
          stuck_secs="$(( CI_STUCK_MINUTES * 60 ))"

          # isCrossRepository excluded for correctness, not just least-privilege:
          # `action_required` on a FORK PR is the ordinary, healthy "a maintainer
          # must approve this run" state. Escalating those would be pure noise
          # and would train people to ignore this label.
          prs="$(gh pr list -R "${REPO}" --state open --limit 100 \
            --json number,headRefOid,isCrossRepository,labels \
            --jq '.[] | select(.isCrossRepository | not)
                      | select([.labels[].name] | index("needs-human") | not)
                      | "\(.number) \(.headRefOid)"')"

          if [ -z "${prs}" ]; then
            echo "No eligible open PRs — nothing to check."
            exit 0
          fi

          while read -r num sha; do
            [ -z "${num}" ] && continue

            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion}]' 2>/dev/null || echo '[]')"

            # In flight — CI is doing its job, leave it alone.
            live="$(jq '[.[] | select(.status != "completed")] | length' <<<"${runs}")"
            if [ "${live}" -gt 0 ]; then
              echo "#${num}: a run is still in flight — skipping."
              continue
            fi

            # A real verdict exists. `failure` is deliberately treated as
            # healthy HERE: autofix owns red CI, and two loops escalating the
            # same PR would double-label it.
            verdicts="$(jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")] | length' <<<"${runs}")"
            if [ "${verdicts}" -gt 0 ]; then
              echo "#${num}: CI reached a verdict — healthy, skipping."
              continue
            fi

            # No verdict: either zero runs, or only non-executing ones
            # (action_required / cancelled / skipped). Check the head commit is
            # old enough that this cannot just be a run about to start.
            pushed="$(gh api "repos/${REPO}/commits/${sha}" \
              --jq '.commit.committer.date' 2>/dev/null || echo '')"
            if [ -z "${pushed}" ]; then
              echo "#${num}: could not read head commit date — skipping rather than guessing."
              continue
            fi
            age=$(( now - $(date -d "${pushed}" +%s) ))
            if [ "${age}" -lt "${stuck_secs}" ]; then
              echo "#${num}: no CI verdict yet but head is only $(( age / 60 ))m old — giving it time."
              continue
            fi

            # One comment per PR, ever: the marker is checked against
            # github-actions[bot]'s own comments only, the same author gate
            # every other marker in this pipeline uses (audit 2026-07-28 N3) so
            # a hostile comment cannot suppress the escalation.
            already="$(gh pr view "${num}" -R "${REPO}" --json comments \
              --jq "[.comments[] | select((.author.login == \"github-actions\" or .author.login == \"github-actions[bot]\") and (.body | contains(\"${CI_STUCK_MARKER}\")))] | length" 2>/dev/null || echo 1)"
            # Defaults to 1 (= "already commented") on a read failure, so a
            # transient API error costs a comment rather than duplicating one.
            [ -z "${already}" ] && already=1

            echo "#${num}: head ${sha} is $(( age / 60 ))m old with no executed CI run — escalating to needs-human."
            gh pr edit "${num}" -R "${REPO}" --add-label needs-human || true
            if [ "${already}" -eq 0 ]; then
              gh pr comment "${num}" -R "${REPO}" --body \
                "${CI_STUCK_MARKER}
          🧹 Groundskeeper: this PR's head commit (\`${sha}\`) is over ${CI_STUCK_MINUTES} minutes old and **no CI run ever executed on it** — there is either no run at all, or one recorded \`action_required\` with zero jobs.

          That happens when the head commit was pushed by a job's own \`GITHUB_TOKEN\` (the conflict-resolver's checkpoint, or a merge commit landing on the branch): such pushes cannot trigger workflows. No loop catches it — \`ci-retry\`/\`autofix\` key on \`failure\`, and auto-merge just declines quietly because the checks are not green. Left alone the PR sits invisible indefinitely (issue #1348).

          **This is not auto-recoverable from inside Actions**: the run is terminal, re-running a zero-job run produces another one, and any push from here would be \`GITHUB_TOKEN\`-authored too. To clear it, push any commit to this branch under a normal user or App identity (for example merging \`main\` in) and CI will run properly. Then remove \`needs-human\`." || true
            fi
          done <<< "${prs}"

name: Agent verify push
description: >-
  Assert deterministically that an agent actually pushed something to a PR
  branch; if it did not, label the PR for a human, explain why on the PR, and
  FAIL the job loudly. Shared by the three PR-repair loops.

# ---------------------------------------------------------------------------
# WHY THIS EXISTS (see docs/CICD.md §4.1 M8)
#
# An agent that narrates work it did not do must not produce a green run. The
# build worker learned this the expensive way: a run finished
# conclusion=success with twelve permission denials, no branch, no PR and no
# relabel — it described the work instead of doing it, and nothing failed. Every
# agent loop therefore ends with a deterministic assertion on the OUTCOME
# (did the branch tip move?), not on the agent's self-report.
#
# It is separate from agent-checkpoint deliberately, even though the two always
# run together: the checkpoint may legitimately publish work AND the verify may
# still escalate, because checkpointed work never cleared the agent's own gate.
# Merging them would make "recovered" and "succeeded" the same outcome, which
# is precisely the distinction pipeline-outcomes.yml reports on.
#
# The build worker does NOT use this action. Its verify step asserts a PR
# exists rather than a commit landing, and additionally owns lane labels, the
# resume pointer and the recovery-PR path — a different contract that happens
# to share a name.
#
# WHY CALLERS MUST PIN THIS TO THE DEFAULT BRANCH, NOT `./` — see the long
# note in ../agent-checkpoint/action.yml. It matters more here: this is the
# step that decides whether a run escalates, so PR-head content must never be
# able to define it.
# ---------------------------------------------------------------------------

inputs:
  github-token:
    description: 'Token for the `gh` calls (the job GITHUB_TOKEN).'
    required: true
  repository:
    description: 'owner/repo the PR belongs to.'
    required: false
    default: ${{ github.repository }}
  pr-number:
    description: 'PR whose head is being checked.'
    required: true
  head-before:
    description: 'Head sha recorded before the agent ran. An unchanged tip means the agent pushed nothing.'
    required: true
  success-message:
    description: 'Logged when the tip moved.'
    required: false
    default: 'Agent pushed a change; CI will re-run on the new commit.'
  error-message:
    description: 'Emitted as a ::error:: annotation when the tip did not move.'
    required: false
    default: 'Agent produced no new commit.'
  escalation-label:
    description: 'Label added to the PR on failure.'
    required: false
    default: 'needs-human'
  escalate-marker:
    description: 'Marker HTML comment, emitted as line 1 so pipeline-outcomes.mjs can count the escalation.'
    required: true
  escalation-body:
    description: 'Loop-specific prose explaining the escalation. Emitted verbatim under the marker.'
    required: true
  summary-title:
    description: "<details> summary for the agent's captured final message."
    required: false
    default: "Agent's final summary (what it says blocked it)"
  no-summary-note:
    description: >-
      Printed when no agent summary could be captured. Leave empty to print
      nothing at all (a silent stop is itself the tell).
    required: false
    default: ''
  execution-file:
    description: "Path to the agent step's execution log, for extracting its final message."
    required: false
    default: ''
  fallback-execution-file:
    description: 'Second execution log to try when the first is empty (the conflict resolver has two agent paths).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      # Inputs reach the script through env, never ${{ }}-interpolated into the
      # body — see ../agent-checkpoint/action.yml for why.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_BEFORE: ${{ inputs.head-before }}
        SUCCESS_MESSAGE: ${{ inputs.success-message }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
        ESCALATION_LABEL: ${{ inputs.escalation-label }}
        ESCALATE_MARKER: ${{ inputs.escalate-marker }}
        ESCALATION_BODY: ${{ inputs.escalation-body }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
        NO_SUMMARY_NOTE: ${{ inputs.no-summary-note }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        FALLBACK_EXECUTION_FILE: ${{ inputs.fallback-execution-file }}
      run: |
        set -euo pipefail

        # Read the branch's current remote tip via the API rather than
        # `git fetch`: every caller checks out with persist-credentials:false,
        # so there is no git credential in .git/config for a fetch, and this
        # avoids reintroducing one. head-before was captured from the local
        # checkout (`git rev-parse HEAD` needs no credential).
        after="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json headRefOid --jq '.headRefOid')"
        if [ "${after}" != "${HEAD_BEFORE}" ]; then
          echo "${SUCCESS_MESSAGE}"
          exit 0
        fi

        echo "::error::${ERROR_MESSAGE}"
        gh pr edit "${PR_NUMBER}" --repo "${REPOSITORY}" --add-label "${ESCALATION_LABEL}" || true

        # Surface the agent's OWN final message (best-effort) so a maintainer
        # sees the blocker instead of reverse-engineering it from run logs —
        # the transparency the build worker got in #251. A silent stop leaves
        # no summary, which is itself worth saying — but only as an absence of
        # evidence: the caller's `no-summary-note` must not name a cause the
        # run did not establish (issue #1349).
        summary=""
        exec_file="${EXECUTION_FILE}"
        if [ -z "${exec_file}" ]; then exec_file="${FALLBACK_EXECUTION_FILE}"; fi
        if [ -n "${exec_file}" ] && [ -f "${exec_file}" ]; then
          summary="$(jq -r '[.. | objects | select(.type? == "result") | .result?] | map(select(. != null)) | last // empty' "${exec_file}" 2>/dev/null | head -c 1500 || true)"
        fi

        # --- State what is KNOWN, never a guessed cause (issue #1349) ---
        # The autofix escalation used to assert "the cause needs a
        # workflow-file change I can't push, or it was not safely fixable".
        # On PR #1270 both halves were false: the agent had ended its turn
        # waiting on a background command, so the flake-vs-defect triage
        # CLAUDE.md requires of it never ran at all, and the real fix was a
        # test-file change squarely inside its own push scope. A maintainer
        # read that sentence, believed it, and the PR sat for 7 days.
        #
        # What this step knows is that the tip did not move. Everything past
        # that is inference, so it is derived from the execution log and
        # labelled as inference — never asserted in the loop's fixed prose.
        stop_reason=""
        turns=""
        if [ -n "${exec_file}" ] && [ -f "${exec_file}" ]; then
          stop_reason="$(jq -r '[.. | objects | select(.type? == "result") | .subtype?] | map(select(. != null)) | last // empty' "${exec_file}" 2>/dev/null || true)"
          turns="$(jq -r '[.. | objects | select(.type? == "result") | .num_turns?] | map(select(. != null)) | last // empty' "${exec_file}" 2>/dev/null || true)"
        fi

        outcome_note=""
        case "${stop_reason}" in
          '' | success) ;;
          error_max_turns)
            outcome_note="⚠️ The agent **ran out of turns** rather than finishing (\`${stop_reason}\`${turns:+, ${turns} turns}). The summary below is a partial state, not a verdict on this PR."
            ;;
          *)
            outcome_note="⚠️ The agent's run **ended in an error** (\`${stop_reason}\`). Draw no conclusion about this PR from the summary below."
            ;;
        esac

        # The stall signature (#606, #609, #1270): a clean stop whose last
        # words are about waiting for something else to finish. Every one of
        # those agents had already been instructed to run commands
        # synchronously and never end a turn waiting, so the instruction is
        # demonstrably not the control — this note is. Reaching this code at
        # all means nothing was pushed, so a summary about waiting is
        # suspicious by construction rather than merely unusual.
        #
        # Both arms are anchored on the AGENT deferring its own next step, not
        # merely on the words "once"/"finish" appearing near each other. The
        # first version's second arm was `once (the|that|this)…(finish|land|…)`
        # with no word boundary on the pronouns, so it matched "once **the**y
        # finish" only because "the" is a substring of "they" — and it fired on
        # ordinary refusals like "I could not finish this once the CI logs
        # landed". A detector that flags a fully-reasoned stop as "nobody has
        # looked yet" is the exact harm this whole change exists to remove, so
        # the arm now keys on an explicit deferral verb (check back, come back,
        # resume, pick this up) instead of a pronoun.
        #
        # The third arm was added after a live miss on PR #1390: the autofix
        # agent stopped with "Here's a summary while the security test suite
        # finishes running in the background", which contains no wait word and
        # no deferral verb, so neither of the first two arms fired. Its work
        # was never committed and a human had to read the truncated summary to
        # notice. The arm keys on the agent describing something as CURRENTLY
        # in flight at the moment it stopped. TENSE has to carry that, because
        # the phrase alone does not: an earlier draft of this arm matched the
        # bare "running in the background", which also occurs in "the suite
        # FINISHED running in the background and reported two real failures I
        # could not fix" — a completed diagnosis, flagged as a stall, i.e. the
        # precise harm this whole mechanism exists to prevent. So it keys only
        # on present-tense forms. Every real stall transcript still matches one
        # of them; "finished running" no longer matches anything.
        # Herestring, not `printf … | grep`: under `set -o pipefail` a pipeline
        # where grep -q exits early and printf takes SIGPIPE reports 141 even
        # though grep MATCHED, which would silently disable this note. The
        # summary is capped at 1500 bytes so it would fit the pipe buffer
        # today, but that is a property of an unrelated `head -c` and not
        # something this branch should depend on.
        if [ -z "${outcome_note}" ] && [ -n "${summary}" ] && grep -qiE "(wait|waiting|hold off|stand by)[^.]{0,40}\b(for|on|until)\b|\b(check back|come back|circle back|resume|pick (this|it) up)\b[^.]{0,40}\b(once|when|after|later)\b|\b(still running|finishes running|running now)\b" <<<"${summary}"; then
          outcome_note="⚠️ **This looks like a stall, not a diagnosis.** The agent ended its turn waiting for something to finish (its own words below), so the triage it is instructed to run may never have happened. Read this as \"nobody has looked yet\", NOT as \"the code cannot be fixed\" — re-queue by removing \`${ESCALATION_LABEL}\`."
        fi

        # printf '%s' throughout: the body, the captured summary and the
        # derived note are data, never format strings (the summary is
        # agent-authored text that can contain % sequences).
        {
          printf '%s\n' "${ESCALATE_MARKER}"
          printf '%s\n' "${ESCALATION_BODY}"
          if [ -n "${outcome_note}" ]; then
            printf '\n%s\n' "${outcome_note}"
          fi
          if [ -n "${summary}" ]; then
            printf '\n<details><summary>%s</summary>\n\n' "${SUMMARY_TITLE}"
            printf '%s\n' "${summary}"
            printf '\n</details>\n'
          elif [ -n "${NO_SUMMARY_NOTE}" ]; then
            printf '\n%s\n' "${NO_SUMMARY_NOTE}"
          fi
        } | gh pr comment "${PR_NUMBER}" --repo "${REPOSITORY}" --body-file - || true

        exit 1
